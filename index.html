<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper scissors Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h1 class="rps__heading">Rock, Paper and Scissors Game</h1>
    <main class="main__box">
        <ul class="rps__rules">
            <li class="rule">Play against computer</li>
            <li class="rule">First to score 5 wins</li>
        </ul>

        <div class="rps__container">
            <button class="rock__btn">Rock</button>
            <button class="paper__btn">Paper</button>
            <button class="scissors__btn">Scissors</button>
        </div>

        <div class="message__container">

        </div>

        <div class="reset__container">

        </div>

    </main>
</body>

</html>
