<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper scissors Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="main__box">
        <h1 class="rps__heading">Rock, Paper and Scissors Game</h1>

        <ul class="rps__rules">
            <li class="rule">Play against computer</li>
            <li class="rule">First to score 5 wins</li>
        </ul>

        <div class="rps__container">
            <div class="rps__buttons">
                <button class="rock__btn btn">Rock</button>
                <button class="paper__btn btn">Paper</button>
                <button class="scissors__btn btn">Scissors</button>
            </div>

            <div class="start__container">
                <!-- adding a start button -->
            </div>

            <div class="message__container">

            </div>

            <div class="reset__container">

            </div>
        </div>
    </main>

    <footer>
        <a href="https://github.com/farhanJawed1222/rock__paper__scissors" target="_blank" rel="noopener noreferrer">View on GitHub</a>
    </footer>
</body>

</html>
